name: Application checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: duewise
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: duewise_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U duewise -d duewise_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r services/backend/requirements.lock.txt
      - run: pytest -q
        working-directory: services/backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://duewise:ci-only-password@127.0.0.1:5432/duewise_test
      - run: alembic upgrade head
        working-directory: services/backend
        env:
          DATABASE_URL: postgresql+psycopg://duewise:ci-only-password@127.0.0.1:5432/duewise_test
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: apps/desktop/package-lock.json}
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run build
        working-directory: apps/desktop
